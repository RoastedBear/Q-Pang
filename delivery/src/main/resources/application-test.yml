spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

  main:
    allow-bean-definition-overriding: true