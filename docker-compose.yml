version: '3.8'

services:
  postgres-user:
    image: postgres:16
    container_name: qpang-postgres-user
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userservice
    volumes:
      - postgres-user-data:/var/lib/postgresql/data

  postgres-order:
    image: postgres:16
    container_name: qpang-postgres-order
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orderdb
    volumes:
      - postgres-order-data:/var/lib/postgresql/data

  postgres-company:
    image: postgres:16
    container_name: qpang-postgres-company
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: companydb
    volumes:
      - postgres-company-data:/var/lib/postgresql/data

  postgres-product:
    image: postgres:16
    container_name: qpang-postgres-product
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: productdb
    volumes:
      - postgres-product-data:/var/lib/postgresql/data

  postgres-hub:
    image: postgres:16
    container_name: qpang-postgres-hub
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hubdb
    volumes:
      - postgres-hub-data:/var/lib/postgresql/data

  postgres-delivery:
    image: postgres:16
    container_name: qpang-postgres-delivery
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deliverydb
    volumes:
      - postgres-delivery-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: qpang-redis
    ports:
      - "6379:6379"

  zipkin:
    image: openzipkin/zipkin:2
    container_name: qpang-zipkin
    ports:
      - "9411:9411"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: qpang-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: qpang-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

volumes:
  postgres-user-data:
  postgres-order-data:
  postgres-company-data:
  postgres-product-data:
  postgres-hub-data:
  postgres-delivery-data: